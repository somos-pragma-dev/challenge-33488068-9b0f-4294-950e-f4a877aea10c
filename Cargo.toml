[package]
name = "loan-request-api"
version = "1.0.0"
description = "API REST para gestión de solicitudes de préstamos en fintech - Rust/Actix Web"
authors = ["Fintech Development Team"]
license = "MIT"
edition = "2021"
rust-version = "1.75"

[lib]
path = "src/lib.rs"

[[bin]]
name = "loan-request-api"
path = "src/main.rs"

[dependencies]
actix-web = "4.9.0"
actix-web-validator = "5.0.0"
actix-rt = "2.10.0"
actix-service = "2.0.0"
actix-multipart = "0.6.1"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
diesel = { version = "2.2.0", features = ["postgres", "uuid", "chrono", "r2d2"] }
diesel-async = { version = "0.4.0", features = ["postgres", "bb8"] }
tokio = { version = "1.38.0", features = ["full"] }
thiserror = "1.0.59"
backoff = "0.4.0"
uuid = { version = "1.8.0", features = ["v4", "serde"] }
chrono = { version = "0.4.38", features = ["serde"] }
bb8 = "0.8.5"
r2d2 = "0.8.10"
dotenv = "0.15.0"
log = "0.4"
env_logger = "0.11.0"
futures = "0.3.30"
parking_lot = "0.12.1"
async-trait = "0.1.80"

[dev-dependencies]
mockall = "0.12.1"
tokio-test = "0.4.4"

[features]
default = ["production"]
production = []
development = []

[[test]]
name = "loan_request_integration_test"
path = "tests/loan_request_integration_test.rs"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true